[project]
name = "weldcheck"
version = "0.1.0"
description = "Measure how much a mesh-topology statistic depends on undocumented preprocessing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pengtao Huang" }]
keywords = ["3d-generation", "evaluation", "benchmark", "reproducibility", "mesh"]
dependencies = [
    "libigl>=2.6.3",
    "numpy>=1.26",
    "trimesh>=4.0",
]

[project.scripts]
weldcheck = "weldcheck.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weldcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
